<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aniimo Live Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="collection.css">
<link rel="stylesheet" href="party.css">
</head>
<body>
<div id="map"></div>

<!-- Top-left column: the profile (or its Daily Activity checklist) and the tracked quests under it -->
<div id="left-stack">
<!-- Player profile: picture in its frame, name, level, Primegy and the server's resets -->
<section id="profile" class="hidden">
  <div class="profile-head">
    <span class="profile-picture"><img id="profile-icon" alt=""><img id="profile-frame" alt=""><span id="profile-party"></span></span>
    <span class="profile-name">
      <b id="profile-name"></b>
      <span class="profile-rank" id="profile-rank"><img id="rank-icon" alt=""><span id="rank-name"></span></span>
      <span class="profile-level"><span id="profile-level"></span><span id="profile-exp"></span></span>
      <span class="exp-bar"><i id="exp-fill"></i></span>
    </span>
  </div>
  <div class="profile-row" id="primegy">
    <img id="primegy-icon" alt="">
    <span class="profile-value"><b id="primegy-value">-</b><span id="primegy-max"></span></span>
    <span class="profile-note" id="primegy-next"></span>
    <span class="profile-note" id="primegy-full"></span>
  </div>
  <div class="profile-row" id="reset">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
    <span class="profile-value"><b>Next Day</b></span>
    <span class="profile-note" id="reset-in"></span>
    <span class="profile-note" id="reset-at"></span>
  </div>
  <button class="profile-row" id="daily" title="Show today's tasks">
    <svg viewBox="0 0 24 24"><path d="M12 3c3 4 6 6.5 6 10.5a6 6 0 0 1-12 0C6 9.5 9 7 12 3z"/><circle cx="12" cy="14" r="2.2"/></svg>
    <span class="profile-value"><b>Daily Activity</b></span>
    <span class="profile-note" id="daily-score"></span>
    <span class="profile-note" id="daily-note"></span>
  </button>
  <div class="profile-row" id="talents">
    <img id="talents-icon" alt="">
    <span class="profile-value"><b id="talents-points">-</b><span>Skill Points</span></span>
    <span class="profile-note" id="talents-spent"></span>
  </div>
  <div id="branches"></div>
  <div class="profile-row" id="eggs">
    <svg viewBox="0 0 24 24"><path d="M12 3c3.6 0 6.5 5.4 6.5 10a6.5 6.5 0 0 1-13 0C5.5 8.4 8.4 3 12 3z"/></svg>
    <span class="profile-value"><b>Hatching</b></span>
    <span class="profile-note" id="eggs-next"></span>
    <span class="egg-slots" id="egg-slots"></span>
  </div>
  <button class="profile-row" id="collection-open" title="Open your Aniimo collection">
    <img src="icons/UI_Img_PetReport_CatchQuantity.png" alt="">
    <span class="profile-value"><b>Aniilog</b></span>
    <span class="profile-note" id="collection-summary">Collection</span>
  </button>
</section>

<!-- Daily Activity checklist, opened from the profile: points bar with its reward chests, today's tasks -->
<section id="daily-card" class="hidden">
  <div class="daily-head">
    <b>Daily Activity</b>
    <span id="daily-left"></span>
    <button id="daily-close" title="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>
  <div class="daily-bar" id="daily-bar"></div>
  <div id="daily-tasks"></div>
</section>

<!-- The quests the HUD tracks, one row per tab (Lore / Quests / Journey); a row opens to its steps -->
<section id="quests-card" class="hidden"></section>
</div>

<!-- Party members beside your profile: picture, rank, level, <N>P badge, leader flag, where they are -->
<div id="party" class="hidden"></div>

<!-- Bottom centre: connection status, cursor position, route, and the view buttons -->
<section id="statusbar">
  <span class="status" id="status">Connecting...</span>
  <span class="muted" id="cursor"></span>
  <span class="muted" id="route"></span>
  <button id="fit" title="Fit the island you're on to the screen">Fit</button>
  <button id="connect" class="hidden">Connect to game</button>
  <button id="calibrate" title="Click where you are on the map to add a reference point">Calibrate</button>
</section>

<!-- Bottom-left location panel, laid out like the game's map screen -->
<section id="location">
  <div class="world" title="Current world">
    <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><ellipse cx="20" cy="20" rx="19" ry="6"/></svg>
    <span id="world">-</span>
  </div>
  <div class="place">
    <div class="region-row"><span class="region" id="region">-</span><span class="region-percent" id="region-percent"></span></div>
    <div class="subarea" id="subarea"></div>
    <div class="coords">
      <span id="coords">-</span>
      <button id="copy" class="icon" title="Copy coordinates">
        <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
      </button>
      <span class="height" id="height"></span>
      <span class="daytime" id="daytime"></span>
    </div>
  </div>
</section>

<!-- Mark filters, like the game's map categories -->
<!-- Mark filter, like the game's: search, groups with a round check, one button per mark type -->
<section id="filters">
  <div class="filters-head">
    <span class="filters-title">Filter</span>
    <button id="filters-all" class="text-button" title="Show every marker">All</button>
    <button id="filters-none" class="text-button" title="Hide every marker">None</button>
    <button id="filters-toggle" class="text-button" title="Show or hide the filter list">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
  </div>
  <div class="filters-body">
    <label class="filter-search">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
      <input id="filter-search" type="search" placeholder="Enter keywords to search" autocomplete="off">
    </label>
    <div id="filter-fixed"></div>
    <div id="filter-list"></div>
    <div class="filters-foot">
      <label class="round-check" id="completed-toggle">
        <input type="checkbox" id="show-completed"><i></i><span>Show Completed</span>
      </label>
      <button id="filters-reset" title="Reset the filter"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg></button>
    </div>
  </div>
</section>

<!-- Small area: completion and the Aniimo living there, like the game's area panel -->
<section class="hidden" id="area">
  <div class="area-header">
    <div class="area-weather" id="area-weather"></div>
    <button id="area-close" title="Close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
    <div class="area-level" id="area-level"></div>
    <div class="area-title" id="area-name"></div>
  </div>
  <div class="area-progress">
    <span class="area-pill" id="area-pill"><img src="icons/UI_Img_Map_PetArea_FloatTab_Pet_Nml.png" alt=""><span id="area-percent">-</span></span>
    <div class="area-bar" id="area-bar"></div>
  </div>
  <div id="area-pets"></div>
  <div id="area-detail"></div>
  <div id="area-wild"></div>   <!-- filter for the wild Aniimo dots: rarities and variants -->
</section>

<!-- Tracked Aniimo (yours from the game, or one picked in an area panel) -->
<section id="track" class="hidden">
  <span class="track-portrait">
    <span id="track-icon"></span>
  </span>
  <span class="track-text"><b id="track-name"></b><span id="track-form"></span><span id="track-where"></span></span>
  <button id="track-close" title="Stop showing where it lives"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
</section>

<section class="panel hidden" id="calib">
  <p id="calib-text"></p>
  <div class="buttons">
    <button id="calib-undo">Undo last</button>
    <button id="calib-clear">Clear map</button>
    <button id="calib-done">Done</button>
  </div>
</section>

<!-- Zoom on the left, like the game's map: + / slider / - -->
<div id="zoombar">
  <button id="zoom-in" class="zoom-step" title="Zoom in">+</button>
  <input id="zoom-range" type="range" step="0.25" aria-label="Zoom">
  <button id="zoom-out" class="zoom-step" title="Zoom out">&minus;</button>
  <button id="center" class="map-button on" title="Follow me (keeps your zoom)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8" fill="none"/></svg>
  </button>
</div>

<!-- Collection: full screen over the map (the map stays loaded underneath). Built on first open by collection.js -->
<section id="collection" class="hidden" role="dialog" aria-label="Aniilog">
  <header class="col-head">
    <b class="col-title">Aniilog</b>
    <nav class="col-tabs" id="col-logs"></nav>
    <nav class="col-tabs col-modes" id="col-modes"></nav>
    <button id="col-close" class="col-close" title="Back to the map (Esc)"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </header>
  <div class="col-counters" id="col-counters"></div>
  <div class="col-filters">
    <label class="col-search">
      <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
      <input id="col-search" type="search" placeholder="Search Aniimo" autocomplete="off">
    </label>
    <div class="col-chips" id="col-elements"></div>
    <div class="col-chips" id="col-status"></div>
  </div>
  <div class="col-body">
    <div class="col-grid" id="col-grid"></div>
    <aside class="col-detail hidden" id="col-detail"></aside>
  </div>
</section>

<script>window.OFFLINE_MAP = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
<script src="collection.js"></script>
<script src="party.js"></script>
<script src="wild.js"></script>
</body>
</html>
